raphail:
  name: "RAFAEL"
  version: "2.0"
  user_name: "Daler"
  wake_words:
    - "rafael"
    - "рафаел"
    - "рафаель"
    - "raphael"
    - "rafail"

voice:
  sample_rate: 16000
  channels: 1
  silence_threshold: 350      # boshlang'ich qiymat; mikrofonga qarab avto-moslashadi
  silence_duration: 2.2
  max_record_seconds: 25
  stt_engine: "whisper"       # "whisper" (aniq, offline) yoki "google"
  whisper_model: "small"      # tiny/base/small/medium — kattaroq = aniqroq, sekinroq
  whisper_compute: "int8"     # CPU uchun int8 (tez, kam xotira)
  whisper_language: "uz"      # o'zbekcha uchun majburlash ("" = avto, lekin uz ni arabcha deb xato qiladi)
  tts_voice_uz: "uz-UZ-MadinaNeural"
  tts_voice_ru: "ru-RU-SvetlanaNeural"
  tts_voice_en: "en-US-JennyNeural"
  tts_rate: "+0%"
  tts_volume: "+15%"

ai:
  model: "claude-opus-4-8"
  max_tokens: 512
  study_max_tokens: 700       # dars/o'qish yordami uchun uzunroq javob
  temperature: 0.7
  context_window: 20

conversation:
  followup: true              # buyruqdan keyin "Rafael" demasdan davom etish
  followup_timeout: 7         # necha soniya jim turilsa suhbat tugaydi
  followup_rounds: 4          # ketma-ket nechta follow-up buyruq

system:
  log_level: "INFO"
  log_file: "logs/raphail.log"
  memory_file: "data/memory/conversation.json"

ui:
  theme: "dark"
  window_size: "520x720"
  font_family: "Segoe UI"
  font_size: 12
  history_max_lines: 200
  show_on_start: true
